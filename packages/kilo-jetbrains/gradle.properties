kotlin.stdlib.default.dependency=false
kilo.jetbrains.version=7.1.9-rc.1
# Lux builds are local side-by-side installs (ai.kilocode.jetbrains.lux). This counter continues
# across bases so a new lux build is just -lux<N+1>; build-version.sh reads it and stamps the
# requested base version with the suffix (7.1.8-lux2, 7.8.1-lux3, ...).
kilo.lux.version=5
# When true (default) the JetBrains plugin uses the pinned CLI release from package.json.
# Set to false ONLY for local dev: generate the client from local source + bundle the local binary.
# false is NOT releasable -- production builds fail unless this is true.
kilo.cli.pinned=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.jetbrains.intellij.platform.useCacheRedirector=false
